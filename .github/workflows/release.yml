name: Release

on:
  push:
    tags:
      - "v*.*.*-release"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            web/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix plugin
          npm ci --prefix web

      - name: Run validation
        run: |
          go test ./...
          npm test --prefix plugin
          npm run build --prefix web

      - name: Build release distribution
        run: make release

      - name: Package release distribution
        run: tar -czf "obsipub-${GITHUB_REF_NAME}.tar.gz" -C distrib .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "obsipub-${GITHUB_REF_NAME}.tar.gz" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
