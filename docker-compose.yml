services:
  obsipub:
    image: ghcr.io/asd2003ru/obsipub:latest
    pull_policy: always
    container_name: obsipub
    ports:
      - "${OBSIPUB_PORT:-8088}:8088"
    environment:
      OBSIPUB_API_KEY: ${OBSIPUB_API_KEY:-}
      OBSIPUB_TRUSTED_PROXIES: ${OBSIPUB_TRUSTED_PROXIES:-}
      OBSIPUB_ROOT: /data/notes
      OBSIPUB_HOST: 0.0.0.0
      OBSIPUB_PORT: "8088"
    volumes:
      - ${OBSIPUB_NOTES_DIR:-./notes}:/data/notes
