<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protected — ObsiPub</title></head><body style="font-family:system-ui,sans-serif;background:#111827;color:#e5e7eb;display:flex;align-items:center;justify-content:center;height:100vh;margin:0"><div style="text-align:center;max-width:28rem;padding:1.5rem"><h1 style="font-size:1.5rem;margin-bottom:0.5rem">Protected publication</h1><p style="margin-bottom:1.25rem;color:#9ca3af">This site requires authentication.</p><form id="authForm" action="{{.LoginURL}}" onsubmit="event.preventDefault();submitLogin();" style="display:flex;flex-direction:column;gap:0.5rem;align-items:center"><input type="password" id="pw" placeholder="Password" required style="padding:0.5rem 0.75rem;border-radius:0.375rem;border:1px solid #374151;background:#0f172a;color:#e5e7eb;width:100%;max-width:20rem;font-size:1rem" autocomplete="current-password"><button type="submit" style="padding:0.5rem 1rem;border-radius:0.375rem;border:none;background:#8b5cf6;color:#fff;font-size:1rem;cursor:pointer;max-width:20rem;width:100%">Log in</button></form><p id="authErr" style="margin-top:0.75rem;color:#f87171;min-height:1.25rem;font-size:0.875rem"></p><script>async function submitLogin(){const pw=document.getElementById('pw').value;const errEl=document.getElementById('authErr');try{const resp=await fetch(document.getElementById('authForm').action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});if(resp.ok){window.location.reload();}else{const data=await resp.json().catch(()=>({}));errEl.textContent=data.error||'Login failed';}}catch(e){errEl.textContent='Login failed';}}</script></div></body></html>
