<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}} — ObsiPub</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0f172a;color:#e5e7eb;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,100%);padding:42px;border:1px solid #334155;border-radius:24px;background:linear-gradient(145deg,#1e293b,#111827);box-shadow:0 24px 80px #02061799}.code{font-size:clamp(4rem,14vw,7rem);line-height:.9;font-weight:800;letter-spacing:-.08em;color:#a78bfa}.eyebrow{margin:24px 0 8px;color:#c4b5fd;font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.6rem,4vw,2.25rem)}p{color:#94a3b8;line-height:1.6}.detail{overflow-wrap:anywhere;color:#64748b;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}.home{display:inline-block;margin-top:14px;padding:11px 17px;border-radius:12px;background:#8b5cf6;color:#fff;text-decoration:none;font-weight:700}.home:hover{background:#7c3aed}</style></head><body><main class="card"><div class="code">{{.Status}}</div><div class="eyebrow">ObsiPub</div><h1>{{.Title}}</h1><p>{{.Message}}</p><div class="detail">{{.Detail}}</div><a class="home" href="{{.HomeURL}}">Go to home</a></main></body></html>
